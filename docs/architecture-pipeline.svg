<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-label="Drift's gated pipeline: a deterministic lane renders, extracts, diffs and counts without any model; a model lane judges candidates and writes fixes; and every model output crosses back into the system only through the reconciliation gate or the fix gate.">
  <defs>
    <marker id="p-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5462"/>
    </marker>
    <marker id="p-arRust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B24A2E"/>
    </marker>
    <marker id="p-arPine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F6F5C"/>
    </marker>
  </defs>

  <rect width="1160" height="620" fill="#FFFFFF"/>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">

    <!-- ============ deterministic lane ============ -->
    <rect x="24" y="48" width="1112" height="150" rx="10" fill="#F1F6F4" stroke="#1F6F5C" stroke-width="1.5"/>
    <text x="44" y="74" font-size="10.5" letter-spacing="1.4" fill="#1F6F5C">DETERMINISTIC · NO MODEL MAY RUN HERE, AND NONE MAY BE ADDED</text>

    <rect x="44" y="98" width="170" height="72" rx="7" fill="#FFFFFF" stroke="#9DB5AC" stroke-width="1.5"/>
    <text x="58" y="123" font-size="12" font-weight="600" fill="#131720">render + extract</text>
    <text x="58" y="141" font-size="10.5" fill="#5A6472">resolved computed</text>
    <text x="58" y="157" font-size="10.5" fill="#5A6472">styles, visible text</text>

    <rect x="234" y="98" width="170" height="72" rx="7" fill="#FFFFFF" stroke="#9DB5AC" stroke-width="1.5"/>
    <text x="248" y="123" font-size="12" font-weight="600" fill="#131720">sign + token diff</text>
    <text x="248" y="141" font-size="10.5" fill="#5A6472">every value against</text>
    <text x="248" y="157" font-size="10.5" fill="#5A6472">the repo's own scales</text>

    <rect x="424" y="98" width="170" height="72" rx="7" fill="#FFFFFF" stroke="#9DB5AC" stroke-width="1.5"/>
    <text x="438" y="123" font-size="12" font-weight="600" fill="#131720">count conventions</text>
    <text x="438" y="141" font-size="10.5" fill="#5A6472">3+ screens agreeing;</text>
    <text x="438" y="157" font-size="10.5" fill="#5A6472">disagreement = candidate</text>

    <rect x="614" y="98" width="170" height="72" rx="7" fill="#FFFFFF" stroke="#9DB5AC" stroke-width="1.5"/>
    <text x="628" y="123" font-size="12" font-weight="600" fill="#131720">findings</text>
    <text x="628" y="141" font-size="10.5" fill="#5A6472">written to Firestore</text>
    <text x="628" y="157" font-size="10.5" fill="#5A6472">through the dedupe gate</text>

    <rect x="804" y="98" width="170" height="72" rx="7" fill="#FFFFFF" stroke="#9DB5AC" stroke-width="1.5"/>
    <text x="818" y="123" font-size="12" font-weight="600" fill="#131720">isAutonomousFix</text>
    <text x="818" y="141" font-size="10.5" fill="#5A6472">the whole of Drift's</text>
    <text x="818" y="157" font-size="10.5" fill="#5A6472">autonomy, one function</text>

    <rect x="994" y="98" width="142" height="72" rx="7" fill="#FFFFFF" stroke="#9DB5AC" stroke-width="1.5"/>
    <text x="1008" y="123" font-size="12" font-weight="600" fill="#131720">pull request</text>
    <text x="1008" y="141" font-size="10.5" fill="#5A6472">merged → next run</text>
    <text x="1008" y="157" font-size="10.5" fill="#5A6472">verifies the render</text>

    <path d="M214,134 H228" fill="none" stroke="#4A5462" stroke-width="1.4" marker-end="url(#p-ar)"/>
    <path d="M404,134 H418" fill="none" stroke="#4A5462" stroke-width="1.4" marker-end="url(#p-ar)"/>
    <path d="M594,134 H608" fill="none" stroke="#4A5462" stroke-width="1.4" marker-end="url(#p-ar)"/>
    <path d="M784,134 H798" fill="none" stroke="#4A5462" stroke-width="1.4" marker-end="url(#p-ar)"/>
    <path d="M974,134 H988" fill="none" stroke="#4A5462" stroke-width="1.4" marker-end="url(#p-ar)"/>

    <!-- ============ the gates ============ -->
    <rect x="460" y="270" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#B24A2E" stroke-width="2.5"/>
    <text x="600" y="294" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B24A2E">reconciliation gate</text>
    <text x="600" y="312" font-size="10.5" text-anchor="middle" fill="#7C4B3B">every cited value read back out of</text>
    <text x="600" y="328" font-size="10.5" text-anchor="middle" fill="#7C4B3B">the screen's own record, or dropped</text>

    <rect x="940" y="270" width="196" height="70" rx="8" fill="#FFFFFF" stroke="#B24A2E" stroke-width="2.5"/>
    <text x="1038" y="294" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B24A2E">fix gate</text>
    <text x="1038" y="312" font-size="10.5" text-anchor="middle" fill="#7C4B3B">applies · matches once ·</text>
    <text x="1038" y="328" font-size="10.5" text-anchor="middle" fill="#7C4B3B">in bounds · hits the value</text>

    <text x="252" y="305" font-size="11" text-anchor="middle" fill="#6B7480">A model may only ever answer.</text>
    <text x="252" y="323" font-size="11" text-anchor="middle" fill="#6B7480">Nothing it says becomes a fact</text>
    <text x="252" y="341" font-size="11" text-anchor="middle" fill="#6B7480">until a gate has checked it.</text>

    <!-- ============ model lane ============ -->
    <rect x="24" y="430" width="1112" height="160" rx="10" fill="#F8F1ED" stroke="#B24A2E" stroke-width="1.5"/>
    <text x="44" y="456" font-size="10.5" letter-spacing="1.4" fill="#B24A2E">MODEL · GENKIT AND GEMINI 3.5 FLASH · PROPOSES, NEVER ORIGINATES</text>

    <rect x="424" y="470" width="200" height="68" rx="7" fill="#FFFFFF" stroke="#D8B4A4" stroke-width="1.5"/>
    <text x="438" y="495" font-size="12" font-weight="600" fill="#131720">judge candidates</text>
    <text x="438" y="513" font-size="10.5" fill="#5A6472">given a numbered list,</text>
    <text x="438" y="529" font-size="10.5" fill="#5A6472">not a screen to critique</text>

    <rect x="790" y="470" width="250" height="68" rx="7" fill="#FFFFFF" stroke="#D8B4A4" stroke-width="1.5"/>
    <text x="804" y="495" font-size="12" font-weight="600" fill="#131720">the Fixer</text>
    <text x="804" y="513" font-size="10.5" fill="#5A6472">reads the repo through pure tools</text>
    <text x="804" y="529" font-size="10.5" fill="#5A6472">over files already fetched</text>

    <text x="44" y="568" font-size="10.5" fill="#8A5442">Six flows, all of them here: embed signature · classify archetype · label convention · judge pattern drift · derive conventions · propose fix</text>

    <!-- down: facts to the model -->
    <path d="M440,176 V464" fill="none" stroke="#1F6F5C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#p-arPine)"/>
    <text x="432" y="320" font-size="10.5" fill="#1F6F5C" transform="rotate(-90 432 320)" text-anchor="middle">measured candidates + conventions</text>

    <path d="M880,176 V464" fill="none" stroke="#1F6F5C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#p-arPine)"/>
    <text x="872" y="320" font-size="10.5" fill="#1F6F5C" transform="rotate(-90 872 320)" text-anchor="middle">substitution failed, and why</text>

    <!-- up: proposals through the gates -->
    <path d="M540,470 V346" fill="none" stroke="#B24A2E" stroke-width="1.8" marker-end="url(#p-arRust)"/>
    <path d="M600,270 V212 H699 V176" fill="none" stroke="#B24A2E" stroke-width="1.8" marker-end="url(#p-arRust)"/>
    <text x="712" y="240" font-size="10.5" fill="#B24A2E">survives → a finding</text>

    <path d="M920,470 V400 H1010 V346" fill="none" stroke="#B24A2E" stroke-width="1.8" marker-end="url(#p-arRust)"/>
    <path d="M1010,270 V212 H1065 V176" fill="none" stroke="#B24A2E" stroke-width="1.8" marker-end="url(#p-arRust)"/>
    <text x="1050" y="240" font-size="10.5" text-anchor="end" fill="#B24A2E">opens as a draft</text>

  </g>
</svg>
